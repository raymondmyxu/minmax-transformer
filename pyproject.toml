[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minmax-transformer"
version = "0.1.0"
description = "A constrained fixed-query attention model for predicting min(x) and max(x)."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<2",
    "torch==2.2.2",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["minmax_transformer*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
